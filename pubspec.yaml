name: sigmamoby
description: "Sigma Moby - Phone Marketplace"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+29

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  image_picker: ^1.1.0
  path: ^1.8.3
  url_launcher: ^6.3.0
  intl: ^0.20.3
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  crypto: ^3.0.7
  cloud_functions: ^6.3.6
  firebase_analytics: ^12.4.6
  flutter_svg: ^2.0.9

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1


  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_app_check: ^0.4.6
  photo_view: ^0.15.0
  photo_manager: ^3.0.0
  uuid: ^4.5.3
  smooth_page_indicator: ^3.0.0
  dropdown_search: ^8.1.0
  timeago: ^3.7.1
  flutter_riverpod: ^3.4.2
  wechat_assets_picker: ^10.1.3
  image_gallery_saver_plus: ^5.1.1
  http: ^1.6.0
  firebase_crashlytics: ^5.2.7
  mobile_scanner: ^7.4.0
  image_cropper: ^12.2.1
  flutter_launcher_icons: ^0.14.4
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  firebase_database: ^12.4.7      # presence_service (RTDB)
  flutter_image_compress: ^2.5.1  # image compression
  path_provider: ^2.1.6           # temp dir for compress
  package_info_plus: ^10.2.1       # force update version check
  in_app_update: ^4.2.5


dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  google_sign_in_android: 7.2.16


  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg


  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
